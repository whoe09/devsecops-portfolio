# 워크 플로우 이름(GitHub 웹의 Actions 탭에 표시될 제목)
name: CI Security & Build Pipeline

# 1. Trigger(언제 파이프라인을 동작 시킬것인지!)
on:
  push:
    branches:     # 해당 브렌치에 직접 push 될때
      - main
  pull_request:   # main으로 합치려고 PR 열였을 경우
    branches:
      - main

# 2. 권한 제어(GITHUB_TOKEN 권한 '읽기 전용'으로 강제)
permissions:
  contents: read

# 3. 실행 작업 목록
jobs:
  # ID(내가 고름)
  inspect-runner:
    # GitHub 제공하는 Ubuntu LTS 일회용 가상 머신 할당 요청(개발 환경과 동일하게 설정)
    runs-on: ubuntu-latest

    # 가상머신 안에서 순서대로 실행할 Step 설정
    steps:
      # Step1: git clone 역할
      - name: Checkout Source Code
        # 불변 커밋 해시 uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        uses: actions/checkout@v4   #uses: GitHub 공식팀이 짜놓은 스크립트 사용
      # .nvmrc read + node 구성환경 통일화 + 모노레포 캐시 활성화
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          # 백엔드+프론트엔드 두 lock 파일 추척 + cache key 생성 => 비교군
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      # 백엔드 의존성 무결성 설치(npm ci) + 타입스크립트 컴파일 및 유닛 테스트
      - name: Backend - Install,Build, Test
        working-directory: ./backend
        run: |
          echo "🔒 Installing backend dependencies strictly from lockfile..."
          npm ci
          echo "🔨 Compiling TypeScript to JavaScript..."
          npm run build
          echo "Running unit tests..."
          npm test
      - name: Frontend - Install,Build, Check
        working-directory: ./frontend
        run: |
          echo "🔒 Installing frontend dependencies strictly from lockfile..."
          npm ci
          echo "📦 Building production static assets..."
          npm run build
      # Step2: 가상 머신 정보 + 코드 잘 받았는지 확인

# 워크 플로우 이름(GitHub 웹의 Actions 탭에 표시될 제목)
name: CI Security & Build Pipeline

# 1. Trigger(언제 파이프라인을 동작 시킬것인지!)
on:
  push:
    branches:     # 해당 브렌치에 직접 push 될때
      - main
  pull_request:   # main으로 합치려고 PR 열였을 경우
    branches:
      - main

# 2. 권한 제어(GITHUB_TOKEN 권한 '읽기 전용'으로 강제)
permissions:
  contents: read

# 3. 실행 작업 목록
jobs:
  # ID(내가 고름)
  inspect-runner:
    # GitHub 제공하는 Ubuntu LTS 일회용 가상 머신 할당 요청(개발 환경과 동일하게 설정)
    runs-on: ubuntu-latest

    # 가상머신 안에서 순서대로 실행할 Step 설정
    steps:
      # Step1: git clone 역할
      - name: Checkout Source Code
        # 불변 커밋 해시 uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        uses: actions/checkout@v4   #uses: GitHub 공식팀이 짜놓은 스크립트 사용
      # .nvmrc read + node 구성환경 통일화 + 모노레포 캐시 활성화
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          # 백엔드+프론트엔드 두 lock 파일 추척 + cache key 생성 => 비교군
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      # 백엔드 의존성 무결성 설치(npm ci) + 타입스크립트 컴파일 및 유닛 테스트
      - name: Backend - Install,Build, Test
        working-directory: ./backend
        run: |
          echo "🔒 Installing backend dependencies strictly from lockfile..."
          npm ci
          echo "🔨 Compiling TypeScript to JavaScript..."
          npm run build
          echo "Running unit tests..."
          npm test
      - name: Frontend - Install,Build, Check
        working-directory: ./frontend
        run: |
          echo "🔒 Installing frontend dependencies strictly from lockfile..."
          npm ci
          echo "📦 Building production static assets..."
          npm run build
      # 도커 빌드 엔진 컨테니어 드라이버 활성화
      # 역할: 병렬 스테이징 + GitHub Action 캐시화
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # 백엔드 멀티스테이지 Dockerfile 빌드 검증 및 레이어 캐싱
      - name: Verify Backend Docker Image Build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: 'false'
          load: 'true'
          tags: portfolio-backend:${{ github.sha }}
          # GitHub Action 캐시 스토리지(gha)에 이전 도커 레이어 load + 새 레이어 모두 저장
          cache-from: type=gha, scope=backend
          cache-to: type=gha, mode=max,scope=backend
      # 프론트엔드 멀티스테이지 Dockerfile 빌드 및 레이어 캐싱
      - name: Verify Frontend Docker Image Build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: 'false'
          load: 'true'
          tags: portfolio-frontend:${{ github.sha }}
          cache-from: type=gha, scope=frontend
          cache-to: type=gha, mode=max, scope=frontend
      # 가상머신 내부 빌드 이미지 용량 및 비루트(Non-root) 설정 최종 확인
      - name: Inspect Built Images
        run: |
          echo "📊 빌드된 도커 이미지 목록 및 최적화된 용량 확인:"
          docker images | grep portfolio-
          echo "🔒 백엔드 이미지의 기본 실행 유저(User) 메타데이터 검증:"
          docker inspect --format='Backend Image User: {{.Config.User}}' portfolio-backend:${{ github.sha }}
          echo "🔒 프론트엔드 이미지의 기본 실행 유저(User) 메타데이터 검증:"
          docker inspect --format='Frontend Image User: {{.Config.User}}' portfolio-frontend:${{ github.sha }}

      # Step2: 가상 머신 정보 + 코드 잘 받았는지 확인
#      - name: Check Runner Environment
#        run: |
#          echo "현재 실행 중 가상머신의 사용자: $(whoami)"
#          echo "가상머신 OS 정보: $(uname -a)"
#          echo "내려받은 프로젝트 폴더 목록:"
#          ls -la


# 워크 플로우 이름(GitHub 웹의 Actions 탭에 표시될 제목)
name: CI Security & Build Pipeline

# 1. Trigger(언제 파이프라인을 동작 시킬것인지!)
on:
  push:
    branches:     # 해당 브렌치에 직접 push 될때
      - main
  pull_request:   # main으로 합치려고 PR 열였을 경우
    branches:
      - main
# 2. 권한 제어(GITHUB_TOKEN 권한 '읽기 전용'으로 강제)
permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_BACKEND_REPO: portfolio-backend
  ECR_FRONTEND_REPO: portfolio-frontend

# 3. 실행 작업 목록
jobs:
  # =======================================
  # Job 0: 최전방 보안 게이트 (Shift-Left Security)
  # =======================================
  security-audit:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth:0 => 과거 커밋에 숨겨진 시크릿까지 모두 잡음
      - name: Checkout Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Gitleaks 실행 => 코드 및 전체 git 커밋 히스토리 내 시크릿 유출 검사
      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # =======================================
  # CI (누구나 실행 가능하지만 AWS 권한 없음)
  # =======================================
  build-and-test:
    needs: security-audit
    # GitHub 제공하는 Ubuntu LTS 일회용 가상 머신 할당 요청(개발 환경과 동일하게 설정)
    runs-on: ubuntu-latest

    # 가상머신 안에서 순서대로 실행할 Step 설정
    steps:
      # Step1: git clone 역할
      - name: Checkout Source Code
        # 불변 커밋 해시 uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        uses: actions/checkout@v4   #uses: GitHub 공식팀이 짜놓은 스크립트 사용
      # .nvmrc read + node 구성환경 통일화 + 모노레포 캐시 활성화
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          # 백엔드+프론트엔드 두 lock 파일 추척 + cache key 생성 => 비교군
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      # 백엔드 의존성 무결성 설치(npm ci) + 타입스크립트 컴파일 및 유닛 테스트
      - name: Backend - Install,Build, Test
        working-directory: ./backend
        run: |
          echo "🔒 Installing backend dependencies strictly from lockfile..."
          npm ci
          echo "🔨 Compiling TypeScript to JavaScript..."
          npm run build
          echo "Running unit tests..."
          npm test
      - name: Frontend - Install,Build, Check
        working-directory: ./frontend
        run: |
          echo "🔒 Installing frontend dependencies strictly from lockfile..."
          npm ci
          echo "📦 Building production static assets..."
          npm run build
      # 도커 빌드 엔진 컨테니어 드라이버 활성화
      # 역할: 병렬 스테이징 + GitHub Action 캐시화
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # 백엔드 멀티스테이지 Dockerfile 빌드 검증 및 레이어 캐싱
      - name: Verify Backend Docker Image Build (CI Verification)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: 'false'
          load: 'true'
          tags: portfolio-backend:${{ github.sha }}
          # GitHub Action 캐시 스토리지(gha)에 이전 도커 레이어 load + 새 레이어 모두 저장
          cache-from: type=gha, scope=backend
          cache-to: type=gha, mode=max,scope=backend
      # 프론트엔드 멀티스테이지 Dockerfile 빌드 및 레이어 캐싱
      - name: Verify Frontend Docker Image Build (CI Verification)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: 'false'
          load: 'true'
          tags: portfolio-frontend:${{ github.sha }}
          cache-from: type=gha, scope=frontend
          cache-to: type=gha, mode=max, scope=frontend
      # 가상머신 내부 빌드 이미지 용량 및 비루트(Non-root) 설정 최종 확인
      - name: Inspect Built Images
        run: |
          echo "📊 빌드된 도커 이미지 목록 및 최적화된 용량 확인:"
          docker images | grep portfolio-
          echo "🔒 백엔드 이미지의 기본 실행 유저(User) 메타데이터 검증:"
          docker inspect --format='Backend Image User: {{.Config.User}}' portfolio-backend:${{ github.sha }}
          echo "🔒 프론트엔드 이미지의 기본 실행 유저(User) 메타데이터 검증:"
          docker inspect --format='Frontend Image User: {{.Config.User}}' portfolio-frontend:${{ github.sha }}
      # ==============
      # ECR 배포 전 컨테이너 이미지 취약점 정밀 스캔(Trivy)
      # ==============
      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'portfolio-backend:${{ github.sha }}'
          format: 'table'
          # CRITICAL,HIGH 타겟팅
          severity: 'HIGH,CRITICAL'
          # 패치 버전 존재하는 취약점만 필터링
          ignore-unfixed: 'true'
          # 종류선정
          vuln-type: 'os,library'
          # 1: 취약점 1개라도 발견시 파이프라인 즉시 실패
          exit-code: '1'
      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'portfolio-frontend:${{ github.sha }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: 'true'
          vuln-type: 'os,library'
          exit-code: '1'

  # ==========================================================
  # Job 2: CD (CI가 성공하고, main 브랜치에 push된 경우에만 실행!)
  # ==========================================================
  deploy-to-ecr:
    # CI (build-and-test) 선행되어야함
    needs: build-and-test
    # Push 일때만 실행
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # 해당 job OIDC 전자여권(id-token) 발급권한 부여
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      # ===
      # 디버깅
      # ===
#      - name: Debug OIDC Token Claims
#        run: |
#          echo "🔍 1. GitHub Context 확인:"
#          echo "Repository: ${{ github.repository }}"
#          echo "Ref: ${{ github.ref }}"
#          echo "Event: ${{ github.event_name }}"
#
#          echo "🔍 2. 실제 발급된 OIDC JWT 토큰의 Payload(내용물) 디코딩:"
#          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
#          echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq '{iss, aud, sub, repository, ref}'
      # OIDC 여권을 AWS STS에 제시 + 임시 출입증 받음
      # 4. OIDC 여권을 AWS STS에 제시하고 1시간짜리 임시 출입증을 발급받음 (Access Key 없음!)
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION  }}

      # 5. 발급받은 임시 출입증으로 Amazon ECR 사설 창고에 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Job1 작업 완료 후 cache-from 그대로 가져와서 backend 이미지 ECR로 push
      - name: Push Backend Image to ECR
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          # IMMUTABLE 설정 => lastest 옵션 없이 고유 커밋 해시(github.sha)만 태그로 지정
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
      - name: PUsh Frontend Image to ECR
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
